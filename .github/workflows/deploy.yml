# Bygger sitet og udgiver det på GitHub Pages ved hvert push til main.
# Første gang: slå Pages til under Settings → Pages → Source: "GitHub Actions".
name: Byg og udgiv

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installér afhængigheder
        run: npm ci

      - name: Kør tests
        run: npm test

      - name: Bestem site-URL (eget domæne via public/CNAME, ellers github.io)
        id: mal
        run: |
          if [ -f public/CNAME ]; then
            echo "site_url=https://$(cat public/CNAME)" >> "$GITHUB_OUTPUT"
            echo "base_path=/" >> "$GITHUB_OUTPUT"
          else
            echo "site_url=https://${GITHUB_REPOSITORY_OWNER,,}.github.io" >> "$GITHUB_OUTPUT"
            echo "base_path=/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Byg sitet
        run: npx astro build
        env:
          SITE_URL: ${{ steps.mal.outputs.site_url }}
          BASE_PATH: ${{ steps.mal.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
